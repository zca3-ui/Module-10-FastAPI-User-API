
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: RUN AUTOMATED TESTS
  # ==========================================

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_db

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fastapi_db \
            -v ON_ERROR_STOP=1 -f sql/01_schema.sql

          psql -h localhost -U postgres -d fastapi_db \
            -v ON_ERROR_STOP=1 -f sql/04_add_password_hash.sql

      - name: Install Playwright browser
        run: |
          playwright install --with-deps chromium

      - name: Create test results directory
        run: mkdir -p test-results

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --junitxml=test-results/unit-results.xml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v \
            --junitxml=test-results/integration-results.xml

      - name: Run end-to-end tests
        run: |
          pytest tests/e2e/ -v \
            --junitxml=test-results/e2e-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/

  # ==========================================
  # JOB 2: BUILD, SCAN, AND DEPLOY DOCKER IMAGE
  # ==========================================

  docker-build-scan-deploy:
    name: Build, Scan, and Deploy Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t fastapi-user-api:${{ github.sha }} \
            -t fastapi-user-api:latest \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fastapi-user-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image for Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag fastapi-user-api:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-user-api:latest

          docker tag fastapi-user-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-user-api:${{ github.sha }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-user-api:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-user-api:${{ github.sha }}